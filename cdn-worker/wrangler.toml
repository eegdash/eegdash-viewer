name            = "eegdash-cdn"
main            = "src/worker.js"
compatibility_date = "2026-05-09"
workers_dev     = false  # custom route only — no .workers.dev subdomain needed

routes = [
  { pattern = "cdn.eegdash.org", custom_domain = true }
]
# Custom-domain binding (newer than the bare `pattern` form): Cloudflare
# automatically creates a proxied DNS record for cdn.eegdash.org pointing
# to the worker. No manual DNS step needed when the zone is in this CF
# account.
