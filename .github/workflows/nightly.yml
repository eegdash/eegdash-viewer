name: Nightly network suite

# The reader + integration tests pull real recordings from OpenNeuro
# S3, so they're too slow / S3-dependent to gate every PR on. Running
# them once a day catches drift in the OpenNeuro layout / dataset
# contents independent of any local change.
on:
  schedule:
    - cron: '17 4 * * *'  # 04:17 UTC, off-peak
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  network:
    name: Network suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run test:net

      - run: npm run test:integration

  # Large-file streaming (incl. the >500MB MEG FIFF targets gated out of
  # PR CI). Opening 644MB-2GB recordings over a cold CDN edge is too noisy
  # for the PR gate (24-40s cold vs ~3-4s warm); tracking it nightly catches
  # real streaming regressions without flaking every PR. STREAMING_NIGHTLY=1
  # un-skips the nightly-flagged targets in streaming-large.spec.mjs.
  streaming-large:
    name: Large-file streaming (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run large-file streaming (incl. >500MB FIFF)
        run: STREAMING_NIGHTLY=1 npm run test:streaming-large
