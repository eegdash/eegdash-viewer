name: CodSpeed benchmarks

# DISABLED on push/PR: the benches run fine (tinybench is pinned to v5 for
# plugin compatibility), but the CodSpeed upload step fails with 401 because
# the repo isn't registered on codspeed.io / CODSPEED_TOKEN secret isn't set.
# Auto-triggers are removed so this doesn't red CI. Perf tracking is covered
# by the "Benchmarks (statistical)" workflow (bench.yml) in the meantime.
# To re-enable: register the repo on codspeed.io, add the CODSPEED_TOKEN
# secret, then restore the `pull_request` / `push` triggers below.
on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  codspeed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - uses: CodSpeedHQ/action@v3
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: SKIP_NETWORK=1 CSE_PERF=1 npm run test:bench
